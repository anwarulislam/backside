name: Build and Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Verify macOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          swift --version
          xcodebuild -version || true

      - name: Build Universal App & Package DMG/ZIP
        run: |
          ./scripts/package.sh --arch universal

      - name: Verify Code Signature
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Backside.app

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Backside-macOS-Universal-Build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt
          retention-days: 14
